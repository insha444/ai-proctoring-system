# ── DataSource (dev override) ────────────────────────────────────
spring.datasource.username=root
spring.datasource.password=insha@111205

# ── JPA: show SQL in dev ─────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ──────────────────────────────────────────────────────
logging.level.com.aiproctor=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── Dev CORS (permissive) ────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080

# ── AI Service Config ────────────────────────────────────────────
app.ai.service.url=http://localhost:8001
app.ai.service.secret=change-me-in-productionmvmvn clean install
