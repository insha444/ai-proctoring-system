# ================================================================
# AI Proctor Backend — application.properties
# ================================================================

spring.application.name=ai-proctor-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── DataSource ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/proctoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:appuser123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ── Connection Pool (HikariCP) ───────────────────────────────────
spring.datasource.hikari.pool-name=AiProctorPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=bXlTdXBlclNlY3VyZUpXVFNlY3JldEtleUZvckFJUHJvY3RvcmluZ1N5c3RlbTI0
app.jwt.expiration-ms=86400000

# ── AI Python Microservice ───────────────────────────────────────
app.ai.service.url=http://localhost:8001
app.ai.service.secret=change-me-in-production
app.ai.service.connect-timeout-ms=3000
app.ai.service.read-timeout-ms=8000

# ── CORS ─────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# ── Server ───────────────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always