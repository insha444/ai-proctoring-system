<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Proctor — Login</title>
  <link rel="stylesheet" href="css/shared.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:24px; }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
    }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .brand-icon {
      width:38px; height:38px; background:var(--accent); border-radius:9px;
      display:flex; align-items:center; justify-content:center; font-size:20px;
    }
    .brand-name { font-size:18px; font-weight:700; }
    h2 { font-size:22px; font-weight:600; margin-top:24px; margin-bottom:4px; }
    .subtitle { color:var(--muted); font-size:13px; margin-bottom:26px; }

    .demo-box {
      background:rgba(47,129,247,.08); border:1px solid rgba(47,129,247,.2);
      border-radius:6px; padding:10px 14px; font-size:12px; color:var(--muted);
      margin-bottom:20px; line-height:1.7;
    }
    .demo-box strong { color:var(--text); }

    .input-wrap { position:relative; }
    .toggle-pw {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--muted); cursor:pointer;
      font-size:14px; padding:2px;
    }
    .toggle-pw:hover { color:var(--text); }

    .footer-link { text-align:center; margin-top:22px; font-size:13px; color:var(--muted); }
    .footer-link a { color:var(--accent); text-decoration:none; }
    .footer-link a:hover { text-decoration:underline; }

    .divider { display:flex; align-items:center; gap:10px; margin:20px 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-size:11px; color:var(--muted); }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-icon">🎓</div>
    <span class="brand-name">AI Proctor</span>
  </div>

  <h2>Sign in to your account</h2>
  <p class="subtitle">Enter your credentials to access the exam portal.</p>

  <div class="demo-box">
    <strong>Demo — Student:</strong> student@proctoring.com / Student@1234<br>
    <strong>Demo — Admin:</strong> admin@proctoring.com / Admin@1234
  </div>

  <div id="alertBox" class="alert"></div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com"
             autocomplete="email" required/>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password"
               autocomplete="current-password" required/>
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">👁</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full" id="loginBtn" style="margin-top:8px;">
      <div class="spinner" id="spinner"></div>
      <span id="btnText" data-default="Sign In">Sign In</span>
    </button>
  </form>

  <div class="footer-link">
    Don't have an account? <a href="register.html">Create one</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
  // ── Redirect if already logged in ─────────────────────────────────────────
  if (Auth.getToken()) {
    const role = Auth.getUser().role;
    window.location.href = role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  }

  // ── Toggle password visibility ────────────────────────────────────────────
  document.getElementById('togglePw').addEventListener('click', () => {
    const input = document.getElementById('password');
    const btn   = document.getElementById('togglePw');
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else                           { input.type = 'password'; btn.textContent = '👁'; }
  });

  // ── Form submit ───────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showAlert('alertBox', '');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showAlert('alertBox', 'Please enter your email and password.', 'error');
      return;
    }

    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled       = true;
    spinner.classList.add('show');
    btnText.textContent = 'Signing in…';

    try {
      const data = await API.post('/api/auth/login', { email, password });
      Auth.save(data);
      showAlert('alertBox', `Welcome back, ${data.name}! Redirecting…`, 'success');
      setTimeout(() => {
        window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
      }, 900);
    } catch (err) {
      showAlert('alertBox', err.message || 'Login failed. Check your credentials.', 'error');
      btn.disabled       = false;
      spinner.classList.remove('show');
      btnText.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
